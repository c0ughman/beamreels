<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exports - Beamreels</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/exports.css">
    <script src="js/config.js"></script>
    <style>
        .auth-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fbfbfd;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .auth-loading-text {
            font-size: 14px;
            color: #6e6e73;
        }
        .app-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-loading" id="authLoading">
        <span class="auth-loading-text">Loading...</span>
    </div>
    <div class="app-container hidden" id="appContainer">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">Beamreels</a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="dashboard.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        <span>Templates</span>
                    </a>
                    <a href="exports.html" class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>Exports</span>
                    </a>
                    <a href="media-library.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span>Media Library</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-label">Account</div>
                    <a href="#" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>Settings</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="usage-indicator">
                    <div class="usage-label">
                        <span>Monthly Usage</span>
                        <span class="usage-value">12 / 50 videos</span>
                    </div>
                    <div class="usage-bar">
                        <div class="usage-progress" style="width: 24%"></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <h1 class="page-title">Exports</h1>
                    <p class="page-subtitle">View and download your generated videos</p>
                </div>
                <div class="header-actions">
                    <button class="btn-secondary" id="downloadAllBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download All
                    </button>
                </div>
            </header>

            <div class="content-body">
                <div class="exports-toolbar">
                    <div class="exports-tabs">
                        <button class="tab-btn active" data-filter="all">All</button>
                        <button class="tab-btn" data-filter="completed">Completed</button>
                        <button class="tab-btn" data-filter="processing">Processing</button>
                    </div>
                    <div class="toolbar-right">
                        <select class="sort-select" id="sortSelect">
                            <option value="recent">Most Recent</option>
                            <option value="template">By Template</option>
                        </select>
                    </div>
                </div>

                <div class="exports-list" id="exportsList">
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </div>
                    <h3 class="empty-state-title">No exports yet</h3>
                    <p class="empty-state-description">When you generate videos from your templates, they'll appear here.</p>
                    <a href="dashboard.html" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        Go to Templates
                    </a>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="videoPreviewModal">
        <div class="video-preview-modal-content">
            <button class="modal-close video-preview-close" id="closeVideoPreview">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <video id="previewPlayer" controls></video>
            <div class="video-preview-info">
                <h3 class="video-preview-title" id="previewTitle">Video Title</h3>
                <div class="video-preview-meta" id="previewMeta">
                    <span>From template</span>
                </div>
                <div class="video-preview-actions">
                    <button class="btn-primary" id="downloadPreviewBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download
                    </button>
                    <button class="btn-secondary" id="deletePreviewBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/exports.js"></script>
    <script>
        (async function() {
            const authLoading = document.getElementById('authLoading');
            const appContainer = document.getElementById('appContainer');

            if (!window.CLERK_PUBLISHABLE_KEY) {
                authLoading.innerHTML = '<span class="auth-loading-text">Authentication not configured</span>';
                return;
            }

            try {
                const clerk = await window.BeamreelsAuth.initClerk();

                if (!clerk || !clerk.user) {
                    window.location.href = 'login.html';
                    return;
                }

                authLoading.style.display = 'none';
                appContainer.classList.remove('hidden');

            } catch (err) {
                console.error('Auth error:', err);
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>
</html>
